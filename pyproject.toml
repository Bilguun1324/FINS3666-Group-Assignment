[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mev-dataset"
version = "0.1.0"
description = "Dataset pipeline for WBTC/WETH Ethereum DEX arbitrage research"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Codex" }
]
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "web3>=7,<8",
  "matplotlib>=3.8",
  "jupyter>=1,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2"
]

[project.scripts]
mev-dataset = "mev_dataset.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
